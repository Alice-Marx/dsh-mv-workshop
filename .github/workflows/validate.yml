name: validate packs

on:
  pull_request:
    paths: ['packs/**', 'scripts/**', '.github/workflows/**']
  push:
    branches: [main]
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test byte-bound browser evidence and immutable catalogue
        run: node --test scripts/browser-evidence.test.mjs scripts/git-pack-reader.test.mjs
      - name: Validate packs (PR — only changed packs, only files under packs/)
        if: github.event_name == 'pull_request'
        env:
          # Maintainers (repo owner) may change tooling; contributors may only add or edit packs.
          WORKSHOP_MAINTAINER: ${{ github.event.pull_request.author_association == 'OWNER' || github.event.pull_request.author_association == 'MEMBER' }}
        run: node scripts/validate.mjs --changed origin/${{ github.base_ref }}
      - name: Validate all packs
        if: github.event_name != 'pull_request'
        run: node scripts/validate.mjs

  index:
    # Rebuild index.json on main after a merge. Commits made with GITHUB_TOKEN do not trigger new runs.
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build index.json
        run: INDEX_COMMIT=$(git rev-parse HEAD) node scripts/build-index.mjs
      - name: Commit index.json if packs changed
        run: |
          # Compare without the volatile fields (generated time and commit).
          strip() { node -e "const j=JSON.parse(require('fs').readFileSync(0,'utf8'));delete j.generated;delete j.commit;console.log(JSON.stringify(j))"; }
          old=$(git show HEAD:index.json 2>/dev/null | strip || echo none)
          new=$(strip < index.json)
          if [ "$old" = "$new" ]; then echo "index.json unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "index: rebuild [skip ci]"
          git push

  mirror:
    # Wait for the index bot, then mirror the final GitHub main. No PR secrets.
    needs: [validate, index]
    if: >-
      always() && github.repository == 'Alice-Marx/dsh-mv-workshop' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.validate.result == 'success' &&
      (needs.index.result == 'success' || needs.index.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: gitee-mirror-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Mirror published main and tags to Gitee (no force or deletion)
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Alice-Marx/dsh-mv-workshop"
          case "$GITHUB_REF" in refs/heads/main|refs/tags/*) ;; *) exit 1 ;; esac
          test -n "$GITEE_TOKEN" || { echo "GITEE_TOKEN secret is not configured"; exit 1; }
          # Public GitHub fetch; do not execute scripts from the checked-out repository.
          git fetch origin main --tags
          git -c credential.helper= \
            -c 'credential.helper=!f() { if [ "$1" = get ]; then printf "%s\n" "username=Alice-Marx" "password=$GITEE_TOKEN"; fi; }; f' \
            -c credential.useHttpPath=true \
            push https://gitee.com/Alice-Marx/dsh-mv-workshop.git \
            refs/remotes/origin/main:refs/heads/main 'refs/tags/*:refs/tags/*'
